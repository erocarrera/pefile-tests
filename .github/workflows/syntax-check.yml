name: Syntax Check

on:
    pull_request:
        paths:
            - "**/*.py"
            - ".github/workflows/syntax-check.yml"
    push:
        branches:
            - main
        paths:
            - "**/*.py"
            - ".github/workflows/syntax-check.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Quick syntax check
        run: python -m compileall -q .

      - name: Detect if tests/pefile_test.py changed
        id: changed-file
        uses: actions/github-script@v8
        with:
          script: |
            const target = 'tests/pefile_test.py';
            let files = [];

            if (context.eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              for await (const page of github.paginate.iterator(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              })) {
                files.push(...page.data.map((f) => f.filename));
              }
            } else if (context.eventName === 'push') {
              const before = context.payload.before;
              const after = context.payload.after;
              if (before && !/^0+$/.test(before)) {
                const compare = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: before,
                  head: after,
                });
                files = (compare.data.files || []).map((f) => f.filename);
              }
            }

            const changed = files.includes(target);
            core.setOutput('pefile_test_changed', changed ? 'true' : 'false');
            core.info(`pefile_test_changed=${changed}`);

      - name: Install pefile from source tarball for deeper check
        if: steps.changed-file.outputs.pefile_test_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install "https://github.com/erocarrera/pefile/archive/refs/heads/master.tar.gz"

      - name: Deeper import/valid syntax check if pefile_test.py changed
        if: steps.changed-file.outputs.pefile_test_changed == 'true'
        run: python tests/pefile_test.py

